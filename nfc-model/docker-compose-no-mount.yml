version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recommender-api
    ports:
      - "8000:8000"
    environment:
      - TRANSFORMERS_CACHE=/app/database/models
      - SENTENCE_TRANSFORMERS_HOME=/app/database/models
      - HF_HOME=/app/database/models
      - TOKENIZERS_PARALLELISM=false
      - PYTHONUNBUFFERED=1
    # No volumes - preferences stored inside container
    # Use named volume if you want to persist data across container restarts
    volumes:
      - user-prefs-data:/app/database
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - recommender-network

volumes:
  user-prefs-data:
    driver: local

networks:
  recommender-network:
    driver: bridge
